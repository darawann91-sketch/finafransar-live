# fly launch --no-deploy  (välj region arn = Stockholm), sedan:
# fly volumes create live_data --region arn --size 1
# fly secrets set APP_SECRET=... SHOPIFY_CLIENT_ID=... SHOPIFY_CLIENT_SECRET=... LIVEKIT_URL=... LIVEKIT_API_KEY=... LIVEKIT_API_SECRET=... ADMIN_EMAIL=... ADMIN_PASSWORD=...
# fly deploy
app = "finafransar-live"
primary_region = "arn"

[build]

[env]
  NODE_ENV = "production"
  PUBLIC_URL = "https://live.finafransar.com"
  STORE_URL = "https://www.finafransar.com"
  SHOPIFY_SHOP = "zrhvuy-pz.myshopify.com"
  SHOPIFY_MODE = "live"
  STREAM_PROVIDER = "livekit"
  STREAM_MAX_HEIGHT = "1080"
  DATA_DIR = "/data"

[[mounts]]
  source = "live_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite + realtime state live in one process: keep exactly ONE machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 8000
    hard_limit = 10000

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
